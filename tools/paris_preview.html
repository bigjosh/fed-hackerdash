<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris Dataset Preview</title>
<!--
  Standalone check page for src/js/data/paris.js (generated by tools/paris_data.py).
  Draws every layer, runs two test routes over the graph and prints decode stats.
    ?view=x0,y0,x1,y1   zoom to a world rectangle in metres
    ?labels=0           hide landmark / arrondissement labels
  python tools/shot.py --page tools/paris_preview.html --size 1800x1000 --out .shots/paris-preview.png
-->
<style>
  :root { --bg: #02050a; --ink: #a9dce8; --dim: #5d8793; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 500 11px "JetBrains Mono", Consolas, monospace; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: absolute; left: 10px; top: 8px; white-space: pre; line-height: 1.35; pointer-events: none;
         background: rgba(2, 5, 10, 0.72); padding: 6px 8px; border: 1px solid #16323b; }
  #legend { position: absolute; right: 10px; bottom: 8px; white-space: pre; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<div id="legend"></div>
<script src="../src/js/core.js"></script>
<script src="../src/js/data/paris.js"></script>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const hud = document.getElementById('hud');

  const t0 = performance.now();
  const P = HD.data.paris;
  const decodeMs = performance.now() - t0;

  const cv = document.getElementById('c');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * dpr);
  cv.height = Math.round(ch * dpr);
  const g = cv.getContext('2d');

  let [vx0, vy0, vx1, vy1] = (q.get('view') || `0,0,${P.W},${P.H}`).split(',').map(Number);
  const s = Math.min(cw / (vx1 - vx0), ch / (vy1 - vy0));
  const ox = (cw - (vx1 - vx0) * s) / 2 - vx0 * s;
  const oy = (ch - (vy1 - vy0) * s) / 2 - vy0 * s;
  g.setTransform(dpr * s, 0, 0, dpr * s, dpr * ox, dpr * oy);
  const px = 1 / s; // one CSS pixel in world metres

  const ringPath = (path, r) => {
    path.moveTo(r[0], r[1]);
    for (let i = 2; i < r.length; i += 2) path.lineTo(r[i], r[i + 1]);
    path.closePath();
  };
  const linePath = (path, l) => {
    path.moveTo(l[0], l[1]);
    for (let i = 2; i < l.length; i += 2) path.lineTo(l[i], l[i + 1]);
  };
  const polyPath = (rings) => {
    const p = new Path2D();
    for (const r of rings) ringPath(p, r);
    return p;
  };

  g.fillStyle = '#02050a';
  g.fillRect(-1e5, -1e5, 3e5, 3e5);

  // world frame
  g.strokeStyle = '#16323b';
  g.lineWidth = px;
  g.strokeRect(0, 0, P.W, P.H);

  // city boundary fill
  const bnd = polyPath(P.boundary);
  g.fillStyle = '#061019';
  g.fill(bnd, 'evenodd');

  // green
  const greenFill = { park: 'rgba(40,140,80,0.35)', wood: 'rgba(30,110,60,0.45)', cemetery: 'rgba(110,130,110,0.35)' };
  for (const p of P.parks) {
    g.fillStyle = greenFill[p.kind] || 'magenta';
    g.fill(polyPath(p.rings), 'evenodd');
  }

  // water
  for (const w of P.water) {
    g.fillStyle = w.kind === 'river' ? 'rgba(43,120,214,0.75)' : w.kind === 'canal' || w.kind === 'basin' ? 'rgba(60,170,255,0.8)' : 'rgba(43,120,214,0.6)';
    g.fill(polyPath(w.rings), 'evenodd');
  }

  // arrondissements
  g.strokeStyle = 'rgba(255,42,109,0.55)';
  g.lineWidth = 1.2 * px;
  for (const a of P.arr) g.stroke(polyPath(a.rings));

  // rail
  const rail = new Path2D();
  for (const l of P.rail) linePath(rail, l);
  g.strokeStyle = 'rgba(190,150,255,0.8)';
  g.lineWidth = 1.2 * px;
  g.setLineDash([4 * px, 2 * px]);
  g.stroke(rail);
  g.setLineDash([]);

  // context roads (outside the city)
  const ctxPath = [new Path2D(), new Path2D()];
  for (const c of P.context) linePath(ctxPath[Math.min(1, c.cls)], c.pts);
  g.strokeStyle = 'rgba(255,182,39,0.35)';
  g.lineWidth = 1.6 * px;
  g.stroke(ctxPath[0]);
  g.strokeStyle = 'rgba(255,182,39,0.22)';
  g.lineWidth = 1 * px;
  g.stroke(ctxPath[1]);

  // graph by class
  const E = P.edges, nodes = P.nodes, geom = P.geom;
  const edgePath = (path, e) => {
    const a = E.a[e] * 2, b = E.b[e] * 2;
    path.moveTo(nodes[a], nodes[a + 1]);
    for (let i = E.g0[e] * 2, n = i + E.gn[e] * 2; i < n; i += 2) path.lineTo(geom[i], geom[i + 1]);
    path.lineTo(nodes[b], nodes[b + 1]);
  };
  const cls = [new Path2D(), new Path2D(), new Path2D(), new Path2D()];
  const champs = new Path2D(), peri = new Path2D(), bridges = new Path2D(), tunnels = new Path2D();
  const champsName = P.names.indexOf('AVENUE DES CHAMPS-ÉLYSÉES');
  const periName = P.names.indexOf('BOULEVARD PÉRIPHÉRIQUE');
  let km = 0;
  for (let e = 0; e < E.count; e++) {
    edgePath(cls[E.cls[e]], e);
    if (E.name[e] === champsName) edgePath(champs, e);
    if (E.name[e] === periName) edgePath(peri, e);
    if (E.flags[e] & 1) edgePath(bridges, e);
    if (E.flags[e] & 2) edgePath(tunnels, e);
    km += E.len[e];
  }
  km /= 1000;
  const style = [
    ['rgba(169,220,232,0.30)', 0.7],
    ['rgba(95,243,255,0.55)', 1.0],
    ['rgba(95,243,255,0.85)', 1.5],
    ['rgba(255,120,60,0.9)', 2.0],
  ];
  for (const c of [3, 2, 1, 0]) {
    g.strokeStyle = style[3 - c][0];
    g.lineWidth = style[3 - c][1] * px;
    g.stroke(cls[c]);
  }
  g.strokeStyle = 'rgba(255,255,255,0.9)';
  g.lineWidth = 1.4 * px;
  g.stroke(bridges);
  g.strokeStyle = 'rgba(120,120,120,0.9)';
  g.setLineDash([3 * px, 2 * px]);
  g.stroke(tunnels);
  g.setLineDash([]);
  g.strokeStyle = '#ffb627';
  g.lineWidth = 3 * px;
  g.stroke(peri);
  g.strokeStyle = '#3dff7f';
  g.lineWidth = 3.5 * px;
  g.stroke(champs);

  // boundary outline
  g.strokeStyle = 'rgba(223,248,255,0.8)';
  g.lineWidth = 1.5 * px;
  g.stroke(bnd);

  // routing check: Dijkstra over edge lengths (oneway ignored, as the map does)
  const nv = nodes.length / 2;
  const adjStart = new Uint32Array(nv + 1);
  for (let e = 0; e < E.count; e++) { adjStart[E.a[e] + 1]++; adjStart[E.b[e] + 1]++; }
  for (let i = 0; i < nv; i++) adjStart[i + 1] += adjStart[i];
  const adj = new Uint32Array(E.count * 2), fill = adjStart.slice(0, nv);
  for (let e = 0; e < E.count; e++) { adj[fill[E.a[e]]++] = e; adj[fill[E.b[e]]++] = e; }
  const nearest = (x, y) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < nv; i++) {
      const d = (nodes[i * 2] - x) ** 2 + (nodes[i * 2 + 1] - y) ** 2;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };
  const route = (s0, t) => {
    const dist = new Float64Array(nv).fill(Infinity), via = new Int32Array(nv).fill(-1);
    const heap = [[0, s0]];
    dist[s0] = 0;
    const push = (it) => { heap.push(it); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
    const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = i * 2 + 1, r = l + 1; let m = i; if (l < heap.length && heap[l][0] < heap[m][0]) m = l; if (r < heap.length && heap[r][0] < heap[m][0]) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
    while (heap.length) {
      const [d, u] = pop();
      if (d > dist[u]) continue;
      if (u === t) break;
      for (let k = adjStart[u]; k < adjStart[u + 1]; k++) {
        const e = adj[k], v = E.a[e] === u ? E.b[e] : E.a[e], nd = d + E.len[e];
        if (nd < dist[v]) { dist[v] = nd; via[v] = e; push([nd, v]); }
      }
    }
    const path = new Path2D();
    let u = t, n = 0;
    while (u !== s0 && via[u] >= 0) { edgePath(path, via[u]); const e = via[u]; u = E.a[e] === u ? E.b[e] : E.a[e]; n++; }
    return { path, dist: dist[t], edges: n };
  };
  const lm = Object.fromEntries(P.landmarks.map((l) => [l.name, l]));
  const tr0 = performance.now();
  const routes = [
    ['ARC DE TRIOMPHE', 'PLACE DE LA BASTILLE'],
    ['PARC DES PRINCES', 'LA VILLETTE'],
    ['GARE MONTPARNASSE', 'SACRÉ-CŒUR'],
  ].map(([a, b]) => ({ a, b, ...route(nearest(lm[a].x, lm[a].y), nearest(lm[b].x, lm[b].y)) }));
  const routeMs = performance.now() - tr0;
  g.strokeStyle = '#ff2340';
  g.lineWidth = 3 * px;
  for (const r of routes) g.stroke(r.path);

  // labels
  const showLabels = q.get('labels') !== '0';
  const txt = (t, x, y, color, size, align = 'center') => {
    g.save();
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.font = `600 ${size}px "Chakra Petch", "Segoe UI", sans-serif`;
    g.textAlign = align;
    g.textBaseline = 'middle';
    const sx = x * s + ox, sy = y * s + oy;
    g.lineWidth = 3;
    g.strokeStyle = 'rgba(2,5,10,0.85)';
    g.strokeText(t, sx, sy);
    g.fillStyle = color;
    g.fillText(t, sx, sy);
    g.restore();
  };
  if (showLabels) {
    for (const a of P.arr) {
      const [n, nm] = a.name.split(' · ');
      txt(n, a.label[0], a.label[1] - 7 * px, 'rgba(255,42,109,0.95)', 15);
      txt(nm, a.label[0], a.label[1] + 8 * px, 'rgba(255,42,109,0.75)', 10);
    }
    const seen = new Set();
    for (const w of P.water) {
      if (!w.name || seen.has(w.name) || w.kind === 'river') continue;
      seen.add(w.name);
      const r = w.rings[0];
      txt(w.name, r[0], r[1], 'rgba(120,190,255,0.8)', 9, 'left');
    }
  }
  const kindColor = { monument: '#ff2340', museum: '#ff2a6d', station: '#ffb627', square: '#dff8ff', venue: '#3dff7f' };
  for (const l of P.landmarks) {
    g.fillStyle = kindColor[l.kind] || '#fff';
    g.beginPath();
    g.arc(l.x, l.y, 4 * px, 0, Math.PI * 2);
    g.fill();
    if (showLabels) txt(l.name, l.x + 7 * px, l.y, kindColor[l.kind] || '#fff', 11, 'left');
  }

  const cnt = (arr, k) => arr.filter((x) => x.kind === k).length;
  const stats = {
    decodeMs: +decodeMs.toFixed(1),
    innerDecodeMs: +P.decodeMs.toFixed(1),
    W: P.W, H: P.H,
    vertices: nv, edges: E.count, geomPts: geom.length / 2, km: +km.toFixed(1), names: P.names.length,
    context: P.context.length, water: P.water.length, parks: P.parks.length,
    parkKinds: { park: cnt(P.parks, 'park'), wood: cnt(P.parks, 'wood'), cemetery: cnt(P.parks, 'cemetery') },
    arr: P.arr.length, boundaryRings: P.boundary.length, rail: P.rail.length, landmarks: P.landmarks.length,
    routes: routes.map((r) => `${r.a} -> ${r.b}: ${(r.dist / 1000).toFixed(2)} km, ${r.edges} edges`),
    routeMs: +routeMs.toFixed(1),
    roundTrip: (() => { const [la, lo] = P.toLatLon(...P.toXY(48.8584, 2.2945)); return [la, lo]; })(),
  };
  window.__paris = stats;
  hud.textContent =
    `HD.data.paris  ${P.attribution}\n` +
    `world ${P.W} x ${P.H} m   decode ${stats.decodeMs} ms\n` +
    `graph ${nv} vertices · ${E.count} edges · ${stats.geomPts} geom pts · ${stats.km} km · ${stats.names} names\n` +
    `context ${stats.context} · water ${stats.water} · parks ${stats.parks} (${stats.parkKinds.park}/${stats.parkKinds.wood}/${stats.parkKinds.cemetery})` +
    ` · arr ${stats.arr} · rail ${stats.rail} · landmarks ${stats.landmarks}\n` +
    stats.routes.map((r) => 'route ' + r).join('\n') + `  (${stats.routeMs} ms)`;
  document.getElementById('legend').textContent =
    'orange: class 0 · cyan: 1/2 · grey: 3 · amber thick: périphérique · green: champs-élysées\n' +
    'white: bridges · dashed grey: tunnels · dashed violet: rail · red: dijkstra routes · amber faint: context';
})();
</script>
</body>
</html>
